name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    name: HACS Validation
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@22.5.0
        with:
          category: integration
          ignore: brands

  validate-hassfest:
    runs-on: ubuntu-latest
    name: Hassfest Validation
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  tests:
    runs-on: ubuntu-latest
    name: Unit tests (shard ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      SHARD: ${{ matrix.shard }}
      SHARDS: 2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      - run: pytest -n auto -q

  unit-tests:
    runs-on: ubuntu-latest
    name: Unit tests
    needs: tests
    if: always()
    steps:
      - run: |
          if [ "${{ needs.tests.result }}" != "success" ]; then
            echo "Unit test shards: ${{ needs.tests.result }}"
            exit 1
          fi

  import-smoke:
    runs-on: ubuntu-latest
    name: Platform import smoke test
    # hassfest validates the manifest but does NOT import the platform modules,
    # so a bad `from homeassistant...` import slips through. Import every platform
    # against a real Home Assistant to catch it.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install homeassistant pyotp numpy PyTurboJPEG av aioice
      - name: Import all platform modules
        run: |
          cd "$GITHUB_WORKSPACE"
          python - <<'PY'
          import importlib, sys
          sys.path.insert(0, ".")
          mods = [
              "custom_components.glinet_comet",
              "custom_components.glinet_comet.binary_sensor",
              "custom_components.glinet_comet.sensor",
              "custom_components.glinet_comet.switch",
              "custom_components.glinet_comet.button",
              "custom_components.glinet_comet.select",
              "custom_components.glinet_comet.camera",
              "custom_components.glinet_comet.update",
              "custom_components.glinet_comet.services",
              "custom_components.glinet_comet.config_flow",
              "custom_components.glinet_comet.diagnostics",
              "custom_components.glinet_comet.gpio",
              "custom_components.glinet_comet.data",
              "custom_components.glinet_comet.video_session",
              "custom_components.glinet_comet.atx_cleanup",
          ]
          failed = False
          loaded = {}
          for m in mods:
              try:
                  loaded[m] = importlib.import_module(m)
                  print(f"OK   {m}")
              except Exception as e:  # noqa: BLE001
                  failed = True
                  print(f"FAIL {m}: {type(e).__name__}: {e}")

          # Any description tuple assigned to entity.entity_description MUST subclass
          # EntityDescription, or HA crashes reading entity.name -> device_class.
          from homeassistant.helpers.entity import EntityDescription
          for m, attr in (
              ("custom_components.glinet_comet.binary_sensor", "BINARY_SENSORS"),
              ("custom_components.glinet_comet.sensor", "SENSORS"),
              ("custom_components.glinet_comet.switch", "SWITCHES"),
              ("custom_components.glinet_comet.button", "BUTTONS"),
          ):
              mod = loaded.get(m)
              for desc in getattr(mod, attr, ()) if mod else ():
                  if not isinstance(desc, EntityDescription):
                      failed = True
                      print(f"FAIL {m}.{attr}: {desc!r} is not an EntityDescription")
          # video_session imports these lazily; HA core must still ship them.
          for dep in ("aioice", "OpenSSL", "cryptography"):
              try:
                  importlib.import_module(dep)
              except Exception as e:  # noqa: BLE001
                  failed = True
                  print(f"FAIL {dep}: {e}")
          sys.exit(1 if failed else 0)
          PY
